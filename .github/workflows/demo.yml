name: Demo

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: >
          xcodebuild
          -project Satchel.xcodeproj
          -scheme Satchel
          -configuration Release
          -derivedDataPath "$RUNNER_TEMP/dd"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build
      - name: Record demo
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/dd/Build/Products/Release" -name 'Satchel.app' -type d | head -1)"
          test -n "$APP"
          codesign --force --deep --sign - "$APP" || true
          mkdir -p "$RUNNER_TEMP/demo"
          "$APP/Contents/MacOS/Satchel" --demo "$RUNNER_TEMP/demo" || true
          if [ ! -f "$RUNNER_TEMP/demo/satchel-demo.mp4" ]; then
            screencapture -v -V 115 "$RUNNER_TEMP/demo/raw.mov" &
            cap=$!
            sleep 1
            "$APP/Contents/MacOS/Satchel" --demo "$RUNNER_TEMP/demo" --demo-norecord || true
            wait "$cap" || true
          fi
          test -f "$RUNNER_TEMP/demo/satchel-demo.mp4" -o -f "$RUNNER_TEMP/demo/raw.mov"
          find "$RUNNER_TEMP/demo" -type f -exec ls -lh {} \;
      - name: Upload demo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satchel-demo
          path: ${{ runner.temp }}/demo
          if-no-files-found: error
