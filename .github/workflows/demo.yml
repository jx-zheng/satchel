name: Demo

on:
  workflow_dispatch:
    inputs:
      smoke:
        description: Draft smoke only. Not the deliverable.
        type: boolean
        default: true
  push:
    branches:
      - cursor/satchel-selftest-perf-demo-17b5

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: >
          xcodebuild
          -project Satchel.xcodeproj
          -scheme Satchel
          -configuration Release
          -derivedDataPath "$RUNNER_TEMP/dd"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build
      - name: Record demo
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/dd/Build/Products/Release" -name 'Satchel.app' -type d | head -1)"
          test -n "$APP"
          codesign --force --deep --sign - "$APP" || true
          mkdir -p "$RUNNER_TEMP/demo"
          EVENT="${{ github.event_name }}"
          SMOKE="${{ github.event.inputs.smoke }}"
          EXTRA=()
          LIMIT=180
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$SMOKE" != "false" ]; then
            EXTRA+=(--demo-smoke)
            LIMIT=60
            printf 'draft smoke, not the deliverable\n' > "$RUNNER_TEMP/demo/demo-draft.txt"
          fi
          # Launch the bundle so the Dock shows the app icon.
          open "$APP" --args --demo "$RUNNER_TEMP/demo" "${EXTRA[@]}"
          for _ in $(seq 1 30); do
            pgrep -x Satchel >/dev/null && break
            sleep 1
          done
          for _ in $(seq 1 "$LIMIT"); do
            if [ -f "$RUNNER_TEMP/demo/satchel-demo.mp4" ]; then
              break
            fi
            pgrep -x Satchel >/dev/null || break
            sleep 1
          done
          if [ ! -f "$RUNNER_TEMP/demo/satchel-demo.mp4" ]; then
            screencapture -v -V 25 "$RUNNER_TEMP/demo/raw.mov" &
            cap=$!
            sleep 1
            open "$APP" --args --demo "$RUNNER_TEMP/demo" --demo-norecord "${EXTRA[@]}"
            wait "$cap" || true
            for _ in $(seq 1 "$LIMIT"); do
              pgrep -x Satchel >/dev/null || break
              sleep 1
            done
          fi
          test -f "$RUNNER_TEMP/demo/satchel-demo.mp4" -o -f "$RUNNER_TEMP/demo/raw.mov"
          find "$RUNNER_TEMP/demo" -type f -exec ls -lh {} \;
      - name: Upload demo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.smoke != 'false') && 'satchel-demo-draft' || 'satchel-demo' }}
          path: ${{ runner.temp }}/demo
          if-no-files-found: error
